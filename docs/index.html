<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chem-Grid</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2efe6; color: #6b6753; font: 12px/1.4 monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; touch-action: none; display: block;
           width: min(100vw, calc((100vh - 48px) * 400 / 300)); }
  footer { margin-top: 6px; text-align: center; max-width: 90vw; }
  footer a { color: #2b2d42; }
</style>
</head>
<body>
<canvas id="screen" width="400" height="300"></canvas>
<footer>
  Chem-Grid by TheGrumpyGameDev. Font DINOBYTE by mby (CC BY 4.0). Code, art and sound made by an AI agent (Claude Code) at the author's direction. Online scores and feedback by LootLocker.
  <a href="#" id="feedback-link">Send feedback (F)</a> · <a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
</footer>
<script type="text/javascript" src="odin.js"></script>
<script type="text/javascript" src="lootlocker.js"></script>
<script>
  const cv = document.getElementById("screen");
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const css = (rgb) => "#" + (rgb >>> 0).toString(16).padStart(6, "0");
  const T = 32;
  const atlas = new Image();
  atlas.src = "art.png";

  // DINOBYTE (mby, CC BY 4.0): CP437, 16x16 sheet of 6x8 cells, ink tinted at draw time.
  const font = new Image();
  font.src = "font.png";
  const tinted = new Map();
  const tintedFont = (rgb) => {
    let c = tinted.get(rgb);
    if (!c) {
      c = document.createElement("canvas");
      c.width = font.width; c.height = font.height;
      const g = c.getContext("2d");
      g.drawImage(font, 0, 0);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = css(rgb);
      g.fillRect(0, 0, c.width, c.height);
      tinted.set(rgb, c);
    }
    return c;
  };
  const drawText = (x, y, str, rgb, scale) => {
    if (!font.complete || !font.width) return;
    const sheet = tintedFont(rgb);
    let px = Math.round(x);
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i) & 255;
      ctx.drawImage(sheet, (code % 16) * 6, Math.floor(code / 16) * 8, 6, 8,
                    px, Math.round(y), 6 * scale, 8 * scale);
      px += 6 * scale;
    }
  };

  // Order must match `Sound` in src/game/art.odin.
  const SOUND_FILES = ["place", "rotate", "invalid", "molecule", "recognised", "game_over", "win", "molecule_big"]
    .map((n) => "sfx/" + n + ".wav");
  const sounds = [];
  let audio = null;
  const unlock = () => {
    if (audio) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      SOUND_FILES.forEach((f, i) => fetch(f).then((r) => r.arrayBuffer())
        .then((b) => audio.decodeAudioData(b)).then((buf) => { sounds[i] = buf; }).catch(() => {}));
    } catch (e) { audio = null; }
  };
  for (const ev of ["keydown", "pointerdown"]) window.addEventListener(ev, unlock);

  // LootLocker online top scores (endless mode), through the shared SPLORR!! shim (lootlocker.js).
  // LootLocker game Chem-Grid (console id 108545); boards chemgrid_endless (37855) and chemgrid_endless_test
  // (37856). ?board=test sends everything to the test board, so testing never puts scores on the real one.
  // Every host that serves the page (itch.io: https://html-classic.itch.zone) must be on the CORS Allowlist.
  const ll = LootLocker({
    domain: "https://1erks4hq.api.lootlocker.com",
    key: "dev_ab5a123fadbb4b5eb088422d7257219d", // the public client key, not a secret
    version: "1.0.0",
    idKey: "chem-grid-player", // kept from before the shim, so existing players stay who they are
  });
  const testBoard = new URLSearchParams(location.search).get("board") === "test";
  const boardFor = (k) => (testBoard ? k + "_test" : k);
  // Feedback (the shim's form): reports go to the console under Feedback, Game (categories Bug, Idea, Other).
  const feedback = ll.feedbackDialog({ game: "Chem-Grid" });
  document.getElementById("feedback-link").addEventListener("click", (e) => { e.preventDefault(); feedback.open(); });

  const memory = new odin.WasmMemoryInterface();
  odin.runWasm("game.wasm", null, {
    canvas: {
      fill_rect: (x, y, w, h, rgb, alpha) => {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = css(rgb);
        ctx.fillRect(x, y, w, h);
        ctx.globalAlpha = 1;
      },
      blit: (sprite, x, y, alpha) => {
        if (!atlas.complete || !atlas.width) return;
        ctx.globalAlpha = alpha;
        ctx.drawImage(atlas, sprite * T, 0, T, T, x, y, T, T);
        ctx.globalAlpha = 1;
      },
      play_sound: (id) => {
        if (!audio || !sounds[id]) return;
        if (audio.state === "suspended") audio.resume();
        const src = audio.createBufferSource();
        const gain = audio.createGain();
        gain.gain.value = 0.3;
        src.buffer = sounds[id];
        src.connect(gain).connect(audio.destination);
        src.start();
      },
      storage_get: (kp, kl, bp, cap) => {
        try {
          const v = localStorage.getItem(memory.loadString(kp, kl));
          if (v === null) return -1;
          const bytes = new TextEncoder().encode(v);
          if (bytes.length > cap) return -2;
          new Uint8Array(memory.memory.buffer, bp, bytes.length).set(bytes);
          return bytes.length;
        } catch (e) { return -1; }
      },
      storage_set: (kp, kl, vp, vl) => {
        try { localStorage.setItem(memory.loadString(kp, kl), memory.loadString(vp, vl)); } catch (e) {}
      },
      // F on any screen but name typing (the game decides).
      open_feedback: () => { feedback.open(); },
      draw_text: (x, y, ptr, len, rgb, scale) => {
        drawText(x, y, memory.loadString(ptr, len), rgb, scale);
      },
    },
    lootlocker: ll.odinImports(memory, boardFor),
  }, memory);

  // Pointer input, in the 400x300 logical screen. Only a mouse hovers; a finger or pen needs a confirming second tap.
  const logical = (e) => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
  };
  const call = (name, ...args) => { const f = memory.exports[name]; if (f) f(...args); };
  cv.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") { const [x, y] = logical(e); call("pointer_move", x, y); }
  });
  cv.addEventListener("pointerleave", () => call("pointer_leave"));
  cv.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const [x, y] = logical(e);
    if (e.pointerType === "mouse" && e.button === 2) { call("rotate_input", 1); return; }
    call("pointer_down", x, y, e.pointerType === "mouse" ? 1 : 0);
  });
  cv.addEventListener("contextmenu", (e) => e.preventDefault());
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    call("rotate_input", e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
</script>
</body>
</html>
