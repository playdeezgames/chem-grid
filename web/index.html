<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chem-grid</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2efe6; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; touch-action: none;
           width: min(100vw, calc(100vh * 400 / 300)); }
</style>
</head>
<body>
<canvas id="screen" width="400" height="300"></canvas>
<script type="text/javascript" src="odin.js"></script>
<script>
  const cv = document.getElementById("screen");
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const css = (rgb) => "#" + (rgb >>> 0).toString(16).padStart(6, "0");
  const memory = new odin.WasmMemoryInterface();
  odin.runWasm("game.wasm", null, {
    canvas: {
      fill_rect: (x, y, w, h, rgb, alpha) => {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = css(rgb);
        ctx.fillRect(x, y, w, h);
        ctx.globalAlpha = 1;
      },
    },
  }, memory);
</script>
</body>
</html>
